services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-wot}
      HISTORY_DATA_SOURCE: ${HISTORY_DATA_SOURCE:-influxdb}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      HISTORY_DAYS: ${HISTORY_DAYS:-30}
      MAX_POINTS_PER_SERIES: ${MAX_POINTS_PER_SERIES:-50000}
      INFLUX_HOST: ${INFLUX_HOST:-}
      INFLUX_DATABASE: ${INFLUX_DATABASE:-}
      INFLUX_USERNAME: ${INFLUX_USERNAME:-}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD:-}
      INFLUX_MEASUREMENT_PREFIX: ${INFLUX_MEASUREMENT_PREFIX:-device_frmpayload_data_}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
