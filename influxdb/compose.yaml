services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb3
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - ./data:/var/lib/influxdb3/data
