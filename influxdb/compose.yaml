services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb18
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: ${INFLUX_DATABASE:-chirpstack}
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      # v1 storage layout; the old ./data directory holds incompatible v3 files.
      - ./data18:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8086/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
